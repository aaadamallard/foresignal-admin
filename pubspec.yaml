name: foresignal_admin
description: "ForeSignal Admin — the control plane for a self-hosted ForeSignal backend."
publish_to: 'none'
version: 1.0.0+1

# Every version is pinned exactly. They were looked up on pub.dev on
# 2026-10-22 (prompt 001) and are the latest stable release of each package.
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.6
  flutter_local_notifications: 22.3.2
  firebase_core: 5.0.0
  firebase_messaging: 17.0.0
  built_collection: 5.1.2
  built_value: 8.13.0
  # The Alert Builder's area map (prompt 161), looked up on pub.dev on
  # 2026-10-24: flutter_map 8.3.2 (2026-08-27; 8.4.0 is a dev release) and
  # latlong2 0.10.1 (2026-04-27; 1.0.0 is still a dev release), within
  # flutter_map's latlong2 range >=0.9.1 <0.11.0.
  flutter_map: 8.3.2
  latlong2: 0.10.1
  foresignal_api:
    path: lib/api/generated
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
