name: foresignal_admin
description: "ForeSignal Admin — the control plane for a self-hosted ForeSignal backend."
publish_to: 'none'
version: 1.0.0+1

# Every version is pinned exactly. They were looked up on pub.dev on
# 2026-10-22 (prompt 001) and are the latest stable release of each package.
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.6
  flutter_local_notifications: 22.3.2
  firebase_core: 5.0.0
  firebase_messaging: 17.0.0
  built_collection: 5.1.2
  built_value: 8.13.0
  foresignal_api:
    path: lib/api/generated

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
