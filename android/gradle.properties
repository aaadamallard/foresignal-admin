# Sized so a release build fits tool/capped_build.sh's 8 GB cap with the Kotlin daemon beside it.
# Two daemons at the template's 8 GB heap and 4 GB metaspace helped fill 24 GB of swap on 2026-10-25.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# The Kotlin compiler daemon is a JVM of its own; without this it inherits the Gradle heap.
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
# An idle daemon exits after 15 minutes instead of 3 hours, if anything leaves one behind.
org.gradle.daemon.idletimeout=900000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
